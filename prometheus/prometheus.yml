global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'influenza-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080', 'localhost:8080']

  - job_name: 'audit-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['audit-exporter:9400', 'host.docker.internal:9400', 'localhost:9400']
