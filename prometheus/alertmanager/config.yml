global:
  resolve_timeout: 5m

route:
  receiver: 'team-notifications'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'pager'
      continue: true

receivers:
  - name: 'team-notifications'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/TXXXXX/BXXXXX/XXXXXXXX' # replace
        channel: '#alerts'
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}*{{ .Annotations.summary }}* - {{ .Annotations.description }}\n{{ end }}'
    email_configs:
      - to: 'ops@example.com'

  - name: 'pager'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/TXXXXX/BXXXXX/XXXXXXXX'
        channel: '#pager'
        title: '[PAGER] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}*{{ .Annotations.summary }}* - {{ .Annotations.description }}\n{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
